<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Agriturismo La Morò">
  <defs>
    <linearGradient id="oliveText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93a04f"/>
      <stop offset="1" stop-color="#6f7d33"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c9a45"/>
      <stop offset="1" stop-color="#5f6d2c"/>
    </linearGradient>
    <radialGradient id="oliveBody" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#5a6b3f"/>
      <stop offset="0.45" stop-color="#2b3320"/>
      <stop offset="1" stop-color="#0f1309"/>
    </radialGradient>
  </defs>

  <!-- Agriturismo -->
  <text x="60" y="118" font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="96" fill="url(#oliveText)" letter-spacing="1"
        style="font-style:italic">Agriturismo</text>

  <!-- La (brown) Mor (olive) -->
  <text x="150" y="268" font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="150" fill="#6b4e37">La</text>
  <text x="392" y="268" font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="150" fill="url(#oliveText)">Mor</text>

  <!-- olive branch (stem + elongated leaf) -->
  <g transform="translate(560,70)">
    <path d="M15,120 C55,70 120,30 205,18" fill="none" stroke="url(#leaf)" stroke-width="7" stroke-linecap="round"/>
    <path d="M70,74 C120,26 190,12 236,10 C205,44 150,80 88,92 C78,86 72,80 70,74 Z" fill="url(#leaf)"/>
    <path d="M96,70 C140,44 186,30 214,26" fill="none" stroke="#465224" stroke-width="2.4" opacity="0.7"/>
  </g>

  <!-- the black olive replacing final "o" of Morò -->
  <g transform="translate(690,205)">
    <ellipse cx="0" cy="0" rx="46" ry="55" fill="url(#oliveBody)"/>
    <ellipse cx="-14" cy="-20" rx="12" ry="17" fill="#c7cf9b" opacity="0.55"/>
    <path d="M6,-54 q10,-10 20,-6" fill="none" stroke="#5f6d2c" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
